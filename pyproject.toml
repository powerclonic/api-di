[project]
name = "api-di"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matheus Dresch", email = "matheus.dresch02@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.importlinter]
root_package = "crm"

[[tool.importlinter.contracts]]
name = "Módulos só se enxergam pelo contracts.py"
type = "independence"
modules = ["crm.modules.*"]
ignore_imports = ["crm.modules.** -> crm.modules.*.contracts"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "shared e clients não dependem de módulos"
type = "forbidden"
source_modules = ["crm.shared", "crm.clients"]
forbidden_modules = ["crm.modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
