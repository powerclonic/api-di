<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>CRM</h1>
    <div id="user" hidden>
      <span id="user-nome"></span>
      <button id="btn-logout" class="link">Sair</button>
    </div>
  </header>

  <main>
    <section id="login" hidden>
      <p>Entre com sua conta corporativa para ver suas tarefas.</p>
      <a class="btn" href="/auth/login">Entrar</a>
    </section>

    <section id="app" class="grade" hidden>
      <aside class="painel" id="p-minhas">
        <h2>Minhas tarefas</h2>
        <form id="form-nova" class="form">
          <input name="titulo" placeholder="Nova tarefa" required>
          <input name="cpf_cnpj" placeholder="CPF/CNPJ do associado" required>
          <div class="linha">
            <input name="prazo" type="date">
            <input name="responsavel_ldap" placeholder="Responsável (LDAP)">
          </div>
          <button>Criar</button>
        </form>
        <ul id="lista-minhas" class="lista"></ul>
        <p class="vazio" hidden>Nenhuma tarefa.</p>
      </aside>

      <div class="centro">
        <section class="painel" id="p-acomp">
          <h2>Acompanhando</h2>
          <ul id="lista-acomp" class="lista"></ul>
          <p class="vazio" hidden>Nada em acompanhamento.</p>
        </section>

        <section class="painel" id="p-visitas">
          <h2>Visitas</h2>
          <form id="form-visita" class="form">
            <div class="linha">
              <input name="cpf_cnpj" placeholder="CPF/CNPJ" required>
              <input name="data" type="date" required>
            </div>
            <textarea name="relato" rows="3" placeholder="Relato da visita" required></textarea>
            <button>Registrar visita</button>
          </form>
          <ul id="lista-visitas" class="lista"></ul>
          <p class="vazio" hidden>Nenhuma visita.</p>
        </section>
      </div>

      <aside class="painel stub" id="p-calendario">
        <h2>Calendário</h2>
        <p>Em breve.</p>
      </aside>
    </section>

    <p id="erro" role="alert" hidden></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
