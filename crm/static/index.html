<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>CRM</h1>
    <div id="user" hidden>
      <span id="user-nome"></span>
      <button id="btn-logout" class="link">Sair</button>
    </div>
  </header>

  <main>
    <section id="login" hidden>
      <p>Entre com sua conta corporativa para ver suas tarefas.</p>
      <a class="btn" href="/auth/login">Entrar</a>
    </section>

    <section id="app" hidden>
      <nav id="modulos">
        <button data-modulo="tarefas" class="ativa">Tarefas</button>
        <button data-modulo="visitas">Visitas</button>
      </nav>

      <div id="view-tarefas">
      <form id="form-nova">
        <h2>Nova tarefa</h2>
        <input name="titulo" placeholder="Título" required>
        <input name="cpf_cnpj" placeholder="CPF/CNPJ do associado" required>
        <input name="prazo" type="date">
        <input name="responsavel_ldap" placeholder="Responsável (LDAP) — vazio = eu">
        <button>Criar</button>
      </form>

      <nav id="abas">
        <button data-visao="minhas" class="ativa">Minhas</button>
        <button data-visao="acompanhando">Acompanhando</button>
      </nav>

      <ul id="lista"></ul>
      <p id="vazio" hidden>Nenhuma tarefa.</p>
      </div>

      <div id="view-visitas" hidden>
        <form id="form-visita">
          <h2>Nova visita</h2>
          <input name="cpf_cnpj" placeholder="CPF/CNPJ do associado" required>
          <input name="data" type="date" required>
          <textarea name="relato" placeholder="Relato da visita" rows="4" required></textarea>
          <button>Registrar</button>
        </form>
        <ul id="lista-visitas"></ul>
        <p id="vazio-visitas" hidden>Nenhuma visita.</p>
      </div>
    </section>

    <p id="erro" role="alert" hidden></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
